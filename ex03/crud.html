<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="cssBÃO.css">
</head>
<body>
    <header>
        <h1>Cadastro de Usuários da UNIBRASIL</h1>
    </header>

    <div class="container">
    <form onsubmit="return false;">
            <h2>Entre na tabela</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>
            
            <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select><br><br>
        
        <label for="turma">Turma:</label>
        <select name="turma" id="turma" required>
            <option value="turma_a">1ESAN (A)</option>
            <option value="turma_b">1ESBN (B)</option>
            <option value="turma_c">1ESCN (C)</option>
        </select><br><br>
        
        <button onclick="adicionarDados()">Cadastrar</button>
    </form>

    <table id="tabela">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Sexo</th>
            <th>Turma</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="corpo_tabela"></tbody>
    </table>
    </div>
            
</body>
<script src="script.js"></script>
</html>
